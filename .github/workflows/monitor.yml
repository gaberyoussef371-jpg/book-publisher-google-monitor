name: Book publisher monitor

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Optional number of rows to test; leave blank for all products'
        required: false
        default: ''

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOOGLE_SHEET_ID: '110ZPf1PpYtMO_MMYqF6tD3A-jgbgPacbPOlQax7yatk'
      SHEET_NAME: 'Products_combined'
      ERROR_SHEET_NAME: 'Monitor Errors'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MONITOR_LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run monitor
        run: python monitor.py
