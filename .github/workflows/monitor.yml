name: Book publisher monitor

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Optional number of rows to test; leave blank for all matching products'
        required: false
        default: ''
      publisher:
        description: 'Optional publisher filter for targeted testing'
        required: false
        type: choice
        options:
          - all
          - karma
          - beit
        default: all

jobs:
  monitor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - row_start: 2
            row_end: 401
          - row_start: 402
            row_end: 801
          - row_start: 802
            row_end: 1201
          - row_start: 1202
            row_end: 1601
          - row_start: 1602
            row_end: 2001
          - row_start: 2002
            row_end: 2401
          - row_start: 2402
            row_end: 2801
          - row_start: 2802
            row_end: 3200
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOOGLE_SHEET_ID: '110ZPf1PpYtMO_MMYqF6tD3A-jgbgPacbPOlQax7yatk'
      SHEET_NAME: 'Products_combined'
      ERROR_SHEET_NAME: 'Monitor Errors'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MONITOR_LIMIT: ${{ github.event.inputs.limit || '0' }}
      PUBLISHER_FILTER: ${{ github.event.inputs.publisher || 'all' }}
      ROW_START: ${{ matrix.row_start }}
      ROW_END: ${{ matrix.row_end }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run monitor
        run: python monitor.py
